<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Rick's Football Sim{% endblock %}</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 16px; max-width: 1100px; margin: 0 auto; color: #222; background: #fafafa; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  h2 { font-size: 1.1rem; margin: 20px 0 8px; }
  a { color: #0645ad; }
  nav { margin-bottom: 12px; font-size: 0.95rem; }
  nav a { margin-right: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
  th, td { border-bottom: 1px solid #ddd; padding: 6px 8px; text-align: left; }
  th { background: #eee; }
  .flash { background: #fff3cd; border: 1px solid #ffe69c; padding: 8px 10px; margin: 8px 0; border-radius: 4px; }
  .msg { background: #e7f1ff; border: 1px solid #b6d4fe; padding: 8px 10px; margin: 6px 0; border-radius: 4px; white-space: pre-wrap; }
  .err { background: #f8d7da; border: 1px solid #f1aeb5; padding: 8px 10px; margin: 6px 0; border-radius: 4px; white-space: pre-wrap; font-family: monospace; font-size: 0.8rem; overflow-x: auto; }
  button, input[type=submit] { font: inherit; padding: 6px 12px; cursor: pointer; }
  .btn-small { padding: 2px 8px; font-size: 0.85rem; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .muted { color: #666; font-size: 0.85rem; }
  form.inline { display: inline; }
  /* scoreboard */
  .board { background: #111; color: #fff; padding: 12px 16px; border-radius: 6px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px 16px; align-items: center; margin: 8px 0; }
  .board .team { font-size: 1.3rem; font-weight: 600; }
  .board .score { font-size: 2.4rem; font-weight: 700; }
  .board .mid { text-align: center; font-size: 0.95rem; line-height: 1.5; }
  .board .light { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #444; margin-right: 6px; vertical-align: middle; }
  .board .light.on { background: #3c3; }
  .board .warn { color: #f55; font-weight: 700; }
  .field { position: relative; height: 26px; background: linear-gradient(90deg, #333 0 8.33%, #2a7 8.33% 91.67%, #333 91.67%); border-radius: 4px; margin: 6px 0 10px; }
  .field .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.45); }
  .field .ball { position: absolute; top: 4px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: #fc3; border: 2px solid #630; box-sizing: border-box; }
  .last { font-size: 1.05rem; padding: 8px 10px; background: #fff; border: 1px solid #ccc; border-radius: 4px; min-height: 1.4em; }
  .boxes label { display: inline-block; margin: 2px 10px 2px 0; font-size: 0.9rem; }
  .log { max-height: 320px; overflow-y: auto; background: #fff; border: 1px solid #ccc; padding: 6px 10px; font-size: 0.9rem; }
  .log div { border-bottom: 1px dotted #ddd; padding: 2px 0; }
  fieldset { border: 1px solid #ccc; border-radius: 4px; margin: 8px 0; }
</style>
</head>
<body>
<nav><a href="{{ url_for('index') }}">Data &amp; teams</a> <a href="{{ url_for('game_page') }}">Game</a> <a href="{{ url_for('history_page') }}">History</a></nav>
{% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
{% block body %}{% endblock %}
</body>
</html>
